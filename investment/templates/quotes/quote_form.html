{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>Добавление котировки</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        {{ form.as_p }}
                    </div>
                </div>
                <button type="submit" class="btn btn-success mt-3">Сохранить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
