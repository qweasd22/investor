{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Редактирование{% else %}Новый депозит{% endif %}</h2>
    <form method="post">
        {% csrf_token %}  <!-- Обязательно добавьте CSRF-токен! -->
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
