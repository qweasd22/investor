{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <div class="card">
        <div class="card-body">
            <h2 class="text-center mb-4">Вход в систему</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
