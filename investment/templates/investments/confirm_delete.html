{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h3>Удаление инвестиции</h3>
        </div>
        <div class="card-body">
            <p>Вы уверены, что хотите удалить инвестицию #{{ object.id }}?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Удалить
                </button>
                <a href="{% url 'investment_list' %}" class="btn btn-secondary">
                    Отмена
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
